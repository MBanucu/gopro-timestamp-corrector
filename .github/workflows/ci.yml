name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        scope: [unit, integration, macos]
        include:
          - scope: unit
            os: ubuntu-latest
          - scope: integration
            os: ubuntu-latest
          - scope: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Ubuntu system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exiftool xvfb exfat-fuse faketime

      - name: Install macOS system deps
        if: matrix.os == 'macos-latest'
        run: brew install exiftool

      - name: Install project
        run: pip install -e .

      - name: Verify install
        run: |
          correct-gopro-timestamps --help
          python -c 'import exiftool_session; print("exiftool_session OK")'
          python -c 'import gui.app; print("gui.app OK")'
          correct-gopro-timestamps --check . || true

      - name: Start Xvfb
        if: matrix.os == 'ubuntu-latest'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 &>/dev/null &
          sleep 1
          python -c 'import tkinter as tk; r=tk.Tk(); r.withdraw(); r.destroy(); print("Tkinter OK")'

      - name: Run unit tests
        if: matrix.scope == 'unit'
        env:
          PYTHONPATH: test
          DISPLAY: :99
        run: |
          python -m unittest -v \
            test.test_unit \
            test.test_analysis \
            test.test_gps \
            test.test_history \
            test.test_preview \
            test.test_dst_fold \
            test.test_common_prefix \
            test.test_proposals \
            test.test_autocomplete \
            test.test_btime \
            test.test_datepicker \
            test.test_editor \
            test.test_file_table \
            test.test_calibration_panel \
            test.test_gui_structure

      - name: Run integration tests
        if: matrix.scope == 'integration'
        env:
          PYTHONPATH: test
          DISPLAY: :99
        run: |
          FAILED=0
          python -m unittest -v test.test_strategy || FAILED=1
          python -m unittest -v test.test_img || FAILED=1
          python -m unittest -v test.test_btime_gui_correction || \
            (echo "=== Retry test_btime_gui_correction ===" && \
             python -m unittest -v test.test_btime_gui_correction) || FAILED=1
          python -m unittest -v test.test_full_auto_integration || FAILED=1
          exit $FAILED

      - name: Run macOS tests
        if: matrix.scope == 'macos'
        env:
          PYTHONPATH: test
        run: |
          python -m unittest -v \
            test.test_analysis \
            test.test_gps \
            test.test_history \
            test.test_preview \
            test.test_dst_fold \
            test.test_common_prefix \
            test.test_proposals \
            test.test_autocomplete
