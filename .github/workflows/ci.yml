name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exiftool exfat-fuse faketime
      - name: Install SDK
        run: pip install -e ./sdk
      - name: Run SDK tests
        run: |
          cd sdk && python -m unittest discover -s test -v

  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exiftool exfat-fuse
      - name: Install SDK + CLI
        run: |
          pip install -e ./sdk
          pip install -e ./cli
      - name: Verify CLI
        run: correct-gopro-timestamps --help

  test-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exiftool xvfb exfat-fuse
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &>/dev/null &
          sleep 1
      - name: Install SDK + GUI
        run: |
          pip install -e ./sdk
          pip install -e ./gui
      - name: Verify GUI
        env:
          DISPLAY: :99
        run: python -c 'from gopro_gui import app; print("GUI OK")'
