name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        scope: [debug, unit, cluster, full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exiftool xvfb exfat-fuse faketime
      - name: Install project deps
        run: pip install -e .
      - name: Capability check
        run: |
          echo "=== Python ==="
          python --version
          echo "=== Tools ==="
          which exiftool xvfb mount.exfat-fuse faketime dd sudo losetup blockdev || true
          echo "=== Kernel ==="
          uname -a
          modinfo exfat 2>/dev/null | head -2 || echo "exfat module not loaded"
          echo "=== sudo ==="
          sudo -n true && echo "passwordless sudo: YES" || echo "passwordless sudo: NO"
          echo "=== dd features ==="
          dd if=/dev/null of=/dev/null bs=1 count=0 status=none 2>&1 && echo "status=none: OK" || echo "status=none: FAIL"
          dd if=/dev/null of=/dev/null bs=1 count=0 iflag=nocache status=none 2>&1 && echo "iflag=nocache: OK" || echo "iflag=nocache: FAIL"
          echo "=== exFAT env check ==="
          PYTHONPATH=src python -m env_check . || true
      - name: Start Xvfb (full scope only)
        if: matrix.scope == 'full'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 &>/dev/null &
          sleep 1
          python -c 'import tkinter as tk; r=tk.Tk(); r.withdraw(); r.destroy(); print("Tkinter OK")'
      - name: Run ${{ matrix.scope }} tests
        env:
          PYTHONPATH: test
          DISPLAY: :99
        run: |
          case ${{ matrix.scope }} in
            debug) python -m unittest test_debug_raw_btime -v 2>&1 ;;
            unit) python -m unittest test.test_unit -v 2>&1 ;;
            cluster) python -m unittest test_cluster_coherence -v 2>&1 ;;
            full)
              python -m unittest test_btime_gui_correction -v 2>&1 || \
                (echo "=== Re-run ===" && \
                 python -m unittest test_btime_gui_correction -v 2>&1; \
                 echo "=== dmesg ===" && \
                 dmesg | tail -30 || true)
              python -m unittest test_exfat_raw_int -v 2>&1 || true
              python -m unittest test_timezone_integration -v 2>&1 || true
              ;;
          esac
