[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "analysis", "btime", "calibration", "correct_timestamps",
    "dst", "env_check", "exiftool_session", "history", "media", "options",
    "plan", "preview", "resolve", "scanner", "writer",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "gopro-timestamp-corrector"
version = "0.1.0"
description = "Correct timestamps of GoPro media files with wrong camera clock"
requires-python = ">=3.10"
dependencies = [
    "pyexiftool @ git+https://github.com/MBanucu/pyexiftool.git@ef015c4c98e14313ef16d9dddc9970819f5b4080",
    "exfat-raw",
]

[project.scripts]
correct-gopro-timestamps = "correct_timestamps:main"
gopro-timestamp-gui = "gui.app:main"
gopro-check-env = "env_check:main"
